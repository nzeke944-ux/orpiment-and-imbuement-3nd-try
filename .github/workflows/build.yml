name: Build Mod Jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the mod source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew runnable
        run: chmod +x ./gradlew

      - name: Build the jar
        run: ./gradlew build

      - name: Upload the finished jar
        uses: actions/upload-artifact@v4
        with:
          name: orpiment-and-imbuement-jar
          path: build/libs/*.jar
